<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des coûts</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f6f7fb;
        color: #1f2937;
      }
      header {
        background: #111827;
        color: white;
        padding: 1rem 2rem;
      }
      main {
        padding: 2rem;
        max-width: 1100px;
        margin: 0 auto;
      }
      .hero {
        background: white;
        padding: 2rem;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }
      .hero-links a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        background: #0f766e;
        color: white;
        text-decoration: none;
        border-radius: 10px;
      }
      .grid {
        display: grid;
        gap: 1rem;
      }
      .card {
        background: white;
        padding: 1.25rem;
        border-radius: 14px;
        box-shadow: 0 10px 20px rgba(15, 23, 42, 0.06);
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Gestion des coûts</strong>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
