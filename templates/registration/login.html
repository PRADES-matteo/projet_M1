<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f3f4f6;
            font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 1.5rem;
        }
        .field-box {
            margin-bottom: 1rem;
        }
        .field-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #374151;
        }
        .field-box input {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #d1d5db;
            border-radius: 10px;
        }
        .field-box input:focus {
            outline: none;
            border-color: #0f766e;
        }
        .submit-btn {
            width: 100%;
            padding: 0.7rem;
            background: #0f766e;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            margin-top: 0.5rem;
        }
        .submit-btn:hover {
            background: #115e59;
        }
        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 0.6rem;
            color: #991b1b;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .brand {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #0f766e;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">ERP</div>
        <div class="login-title">Connexion</div>

        {% if form.errors %}
        <div class="error">
            Identifiant ou mot de passe incorrect.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="field-box">
                <label for="id_username">Identifiant</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    autofocus
                    autocomplete="username"
                >
            </div>

            <div class="field-box">
                <label for="id_password">Mot de passe</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="submit-btn">Se connecter</button>
            <div style="text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #6b7280;">
                Pas encore de compte ?
                <a href="/accounts/register/" style="color: #0f766e; font-weight: 600; text-decoration: none;">
                    Créer un compte
                </a>
            </div>
        </form>
    </div>
</body>
</html>
