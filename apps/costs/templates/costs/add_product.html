{% extends "base.html" %}

{% block content %}
<h1>Ajouter un produit au scénario : {{ scenario.name }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Ajouter le produit</button>
</form>
<a href="{% url 'scenario-detail' scenario.id %}">Retour au scénario</a>
{% endblock %}
