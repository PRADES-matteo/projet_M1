{% extends "costs/base.html" %}

{% block content %}
<div class="container mt-4 mb-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-header text-white" style="background-color: #0f766e;">
            <h5 class="mb-0">Ajouter un produit (Scénario : {{ scenario.name }})</h5>
        </div>
        <div class="card-body">
            <form method="post" novalidate>
                {% csrf_token %} 
                {{ form.non_field_errors }}
                
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-bold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="{% url 'scenario-detail' scenario.id %}" class="text-decoration-none text-secondary">← Retour au scénario</a>
                    <button type="submit" class="btn text-white" style="background-color: #0f766e;" >Ajouter le produit</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
