{% extends "costs/base.html" %}

{% block content %}
<div class="container mt-4 mb-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-header text-white" style="background-color: #0f766e;">
            <h5 class="mb-0">Modifier le produit : {{ product.name }}</h5>
        </div>
        <div class="card-body">
            <form method="post" novalidate>
                {% csrf_token %} 
                {{ form.non_field_errors }}
                
                <div class="mb-3">
                    <label class="form-label fw-bold">{{ form.name.label }}</label>
                    {{ form.name }} 
                    <div class="text-danger small">{{ form.name.errors }}</div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">{{ form.quantity.label }}</label>
                    {{ form.quantity }} 
                    <div class="text-danger small">{{ form.quantity.errors }}</div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold">{{ form.unit_price.label }}</label>
                    {{ form.unit_price }} 
                    <div class="text-danger small">{{ form.unit_price.errors }}</div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="{% url 'scenario-detail' scenario.id %}" class="text-decoration-none text-secondary">← Retour</a>
                    <button type="submit" class="btn text-white" style="background-color: #0f766e;">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
