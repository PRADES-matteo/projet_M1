<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestion des coûts{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #e5e7eb;
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 1.2rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .sidebar-brand {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
            color: #0f172a;
        }

        .sidebar .nav-link {
            color: #374151;
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            transition: 0.2s;
            border-radius: 8px;
            margin: 0.2rem 0.5rem;
        }

        .sidebar .nav-link:hover {
            background-color: #f3f4f6;
        }

        .sidebar .nav-link.active {
            background-color: #0f766e;
            color: white;
        }

        .scenario-section {
            margin-top: 1.5rem;
            padding: 0 1rem 1rem;
        }

        .scenario-title {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #6b7280;
            margin-bottom: 0.8rem;
        }

        .scenario-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .scenario-item {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 0.7rem;
            text-decoration: none;
            color: #111827;
            transition: 0.2s;
            display: block;
        }

        .scenario-item:hover {
            background: #ecfeff;
            border-color: #5eead4;
        }

        .scenario-item.active {
            background: #0f766e;
            color: white;
            border-color: #0f766e;
        }

        .scenario-item.active .scenario-period {
            color: #ccfbf1;
        }

        .scenario-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .scenario-period {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 0.2rem;
        }

        .main-content {
            margin-left: 260px;
            padding: 2rem;
            min-height: 100vh;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="sidebar-header">
        <h4 class="sidebar-brand">CoreUI</h4>
    </div>

    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link {% block nav_dashboard %}{% endblock %}" href="{% url 'scenario-list' %}">
                Tableau de bord
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% block nav_new %}{% endblock %}" href="{% url 'scenario-list' %}">
                Nouveau scénario
            </a>
        </li>
    </ul>

    <div class="scenario-section">
        <div class="scenario-title">Mes scénarios</div>
        <div class="scenario-list" id="scenario-sidebar-list">
            {% for scenario in all_scenarios %}
                <a
                    href="{% url 'scenario-detail' scenario.pk %}"
                    class="scenario-item {% if current_scenario and current_scenario.pk == scenario.pk %}active{% endif %}"
                    hx-get="{% url 'scenario-detail' scenario.pk %}"
                    hx-target="#panel"
                    hx-swap="innerHTML"
                >
                <div class="scenario-name">{{ scenario.name }}</div>
                <div class="scenario-period">{{ scenario.period }}</div>
            </a>
            {% empty %}
            <div style="color: #6b7280; font-size: 0.9rem;">
                Aucun scénario enregistré.
            </div>
            {% endfor %}
        </div>
    </div>

</div>

<!-- MAIN -->
<div class="main-content" id="panel">
    {% block content %}{% endblock %}
</div>

</body>
</html>
