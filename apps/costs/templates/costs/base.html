<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestion des coûts{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #e5e7eb;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1000;
            transition: width 0.25s ease;
            display: flex;           
            flex-direction: column;  
        
        }

        .sidebar.collapsed {
            width: 0;
        }

        .sidebar-header {
            padding: 1.2rem;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        .sidebar-brand {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
            color: #0f172a;
        }

        .sidebar .nav-link {
            color: #374151;
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            transition: 0.2s;
            border-radius: 8px;
            margin: 0.2rem 0.5rem;
            white-space: nowrap;
        }

        .sidebar .nav-link:hover {
            background-color: #f3f4f6;
        }

        .sidebar .nav-link.active {
            color: white;
        }

        .scenario-section {
            margin-top: 1.5rem;
            padding: 0 1rem 1rem;
            white-space: nowrap;
        }

        .scenario-title {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #6b7280;
            margin-bottom: 0.8rem;
        }

        .scenario-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .scenario-item {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 0.7rem;
            text-decoration: none;
            color: #111827;
            transition: 0.2s;
            display: block;
        }

        .scenario-item:hover {
            background: #ecfeff;
            border-color: #5eead4;
        }

        .scenario-item.active {
        }

        .scenario-item.active .scenario-period {
        }

        .scenario-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .scenario-period {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 0.2rem;
        }

        /* TOGGLE BUTTON */
        .sidebar-toggle {
            position: fixed;
            top: 1rem;
            left: 260px;
            z-index: 1100;
            width: 28px;
            height: 28px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.25s ease;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        .sidebar-toggle:hover {
            background: #f3f4f6;
        }

        .sidebar-toggle svg {
            transition: transform 0.25s ease;
        }

        .sidebar-toggle.collapsed {
            left: 0;
        }

        .sidebar-toggle.collapsed svg {
            transform: rotate(180deg);
        }
        
        .main {
            display: flex;
            flex-direction: row;
        }

        /* MAIN */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 2rem;
            min-height: 100vh;
            transition: margin-left 0.25s ease;
        }

        .main-content.expanded {
            margin-left: 0;
        }

        .btn-delete {
            padding: 0.5rem 0.8rem;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-delete:hover {
            background: #b91c1c;
        }

        .messages {
            margin: 1rem 0;
        }

        .message {
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>


<!-- TOGGLE BUTTON -->
<button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" hx-preserve>
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 2L4 7L9 12" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</button>

<!-- SIDEBAR -->
<!-- SIDEBAR -->
<div class="sidebar" id="sidebar" hx-preserve>

    <div class="sidebar-header">
        <h4 class="sidebar-brand">ERP</h4>
    </div>

    <!-- Zone scrollable qui prend tout l'espace disponible -->
    <div style="
        flex: 1; 
        overflow-y: auto; 
        overflow-x: hidden;
        ">

        <ul class="nav flex-column">
            <li class="nav-item">
                <a 
                style="
                padding: 0.6rem;
                background: #0f766e;
                color: white;
            "
            class="nav-link {% block nav_new %}{% endblock %}" href="{% url 'scenario-list' %}">
                    Nouveau scénario
                </a>
            </li>
        </ul>

        <div class="scenario-section">
            <div class="scenario-title">Mes scénarios</div>
            <div class="scenario-list" id="scenario-sidebar-list">
                {% for scenario in all_scenarios %}
                    <div class="scenario-item {% if current_scenario and current_scenario.pk == scenario.pk %}active{% endif %}">

                        <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;">
                            <a
                                href="{% url 'scenario-detail' scenario.pk %}"
                                hx-get="{% url 'scenario-detail' scenario.pk %}"
                                hx-target="#panel"
                                hx-select="#panel"
                                hx-swap="outerHTML"
                                style="text-decoration: none; color: inherit; flex: 1; min-width: 0;"
                            >
                                <div class="scenario-name">{{ scenario.name }}</div>
                            </a>

                            <form
                                method="post"
                                action="{% url 'delete-scenario' scenario.id %}"
                                onsubmit="return confirm('Supprimer ce scénario ?');"
                                style="flex-shrink: 0;"
                            >
                                {% csrf_token %}
                                <button type="submit" title="Supprimer" style="
                                    background: none;
                                    border: none;
                                    cursor: pointer;
                                    padding: 0.2rem;
                                    color: #9ca3af;
                                    display: flex;
                                    align-items: center;
                                    border-radius: 4px;
                                    transition: 0.2s;
                                "
                                onmouseover="this.style.color='#dc2626'"
                                onmouseout="this.style.color='#9ca3af'"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6"/>
                                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                        <path d="M10 11v6"/>
                                        <path d="M14 11v6"/>
                                        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                                    </svg>
                                </button>
                            </form>
                        </div>

                        <a
                            href="{% url 'scenario-detail' scenario.pk %}"
                            hx-get="{% url 'scenario-detail' scenario.pk %}"
                            hx-target="#panel"
                            hx-select="#panel"
                            hx-swap="outerHTML"
                            style="text-decoration: none; color: inherit; display: block;"
                        >
                            <div class="scenario-period">{{ scenario.period }}</div>
                        </a>

                    </div>
                    {% empty %}
                    <div style="color: #6b7280; font-size: 0.9rem;">
                        Aucun scénario enregistré.
                    </div>
                    {% endfor %}
            </div>
        </div>

    </div>
    <!-- Fin zone scrollable -->

    <!-- Bouton déconnexion toujours en bas -->
    <div style="
        padding: 1rem;
        border-top: 1px solid #e5e7eb;
        background: #ffffff;
        flex-shrink: 0;
    ">
        <form method="post" action="/accounts/logout/">
            {% csrf_token %}
            <button type="submit" style="
                width: 100%;
                padding: 0.6rem;
                background: #dc2626;
                color: white;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                font-size: 0.9rem;
                font-weight: 600;
                transition: 0.2s;
            ">
                Déconnexion — {{ request.user.username }}
            </button>
        </form>
    </div>

</div>

<!-- MAIN -->
<div class="main">
    <div class="main-content" id="panel">
        {% block content %}{% endblock %}
    </div>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const toggle = document.getElementById('sidebarToggle');
        const main = document.getElementById('panel');

        sidebar.classList.toggle('collapsed');
        toggle.classList.toggle('collapsed');
        main.classList.toggle('expanded');
    }
</script>

</body>
</html>
