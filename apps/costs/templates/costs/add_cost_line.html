{% extends "costs/base.html" %}

{% block content %}
<h1>Ajouter une ligne de coût pour le produit : {{ product.name }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Ajouter la ligne de coût</button>
</form>
<a href="{% url 'add_product' scenario.id %}">Retour à l'ajout de produit</a>
{% endblock %}
